# Container-only overrides (user-level gradle.properties wins over the project's).
# android/gradle.properties asks for an 8G heap, which exceeds Docker Desktop's default VM memory.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
# Gradle can't watch files on macOS bind mounts
org.gradle.vfs.watch=false
