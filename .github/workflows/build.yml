name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Compute release tag ───────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      app_name: ${{ steps.tag.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d "'\"")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "app_name=safecall" >> "$GITHUB_OUTPUT"

  # ── Android APK (release-signed) ──────────────────────────────────────────────
  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      # The secret is unavailable on PRs from forks and may simply not be set.
      # Warn (job stays green) and write a placeholder so the build still runs:
      # without it :app:processReleaseGoogleServices fails with "Malformed root json".
      # A placeholder APK builds fine, but Firebase / FCM will not work in it.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON//[[:space:]]/}" ]; then
            echo "::warning title=google-services.json not found::Secret GOOGLE_SERVICES_JSON is empty or unavailable. Building with a placeholder google-services.json; Firebase/FCM will not work in this APK."
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "tw.futuremedialab.frauddetect" }
                },
                "api_key": [{ "current_key": "placeholder" }]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename Android APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ needs.version.outputs.app_name }}-android-${{ needs.version.outputs.tag }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/${{ needs.version.outputs.app_name }}-android-${{ needs.version.outputs.tag }}.apk
          retention-days: 5

  # ── iOS .app (no code signing) ────────────────────────────────────────────────
  build-ios:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..
      - run: flutter build ios --release --no-codesign

      - name: Package into unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ${{ needs.version.outputs.app_name }}-ios-${{ needs.version.outputs.tag }}.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/${{ needs.version.outputs.app_name }}-ios-${{ needs.version.outputs.tag }}.ipa
          retention-days: 5

  # ── Web Build ───────────────────────────────────────────────────────────────────
  build-web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - name: Archive Web Build
        run: |
          cd build/web
          zip -r ../../${{ needs.version.outputs.app_name }}-web-${{ needs.version.outputs.tag }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ needs.version.outputs.app_name }}-web-${{ needs.version.outputs.tag }}.zip
          retention-days: 5

  # ── Create GitHub Release ─────────────────────────────────────────────────────
  release:
    if: github.event_name == 'push'
    needs: [version, build-android, build-ios, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - uses: actions/download-artifact@v4
        with:
          name: ios-app
          path: artifacts/ios

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: artifacts/web

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body: |
            Automated release from commit ${{ github.sha }}

            **Branch:** `${{ github.ref_name }}`

            > **iOS note:** `${{ needs.version.outputs.app_name }}-ios-${{ needs.version.outputs.tag }}.ipa` has no code signature. To install on a device, sign it locally with your own certificate or use a tool like [iOS App Signer](https://dantheman827.github.io/ios-app-signer/).
          draft: false
          prerelease: false
          files: |
            artifacts/android/${{ needs.version.outputs.app_name }}-android-${{ needs.version.outputs.tag }}.apk
            artifacts/ios/${{ needs.version.outputs.app_name }}-ios-${{ needs.version.outputs.tag }}.ipa
            artifacts/web/${{ needs.version.outputs.app_name }}-web-${{ needs.version.outputs.tag }}.zip
